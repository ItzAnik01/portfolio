<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Anik Projects</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="project.css">
</head>

<body>

<section class="projects-section">

  <div class="section-title">
    
    <h1>Projects</h1>
   
  </div>

  <div id="projects-container" class="projects-grid"></div>

</section>

<script>

const username = "ItzAnik01";
const container = document.getElementById("projects-container");

async function loadProjects() {

  try {

    const response = await fetch(
      `https://api.github.com/users/${username}/repos?sort=updated&per_page=100`
    );

    const repos = await response.json();

    container.innerHTML = "";

    repos.forEach(async (repo) => {

      if (repo.fork) return;

      let topics = [];

      try {

        const topicRes = await fetch(
          `https://api.github.com/repos/${username}/${repo.name}/topics`,
          {
            headers: {
              Accept: "application/vnd.github.mercy-preview+json"
            }
          }
        );

        const topicData = await topicRes.json();
        topics = topicData.names || [];

      } catch (err) {
        console.log("No topics found");
      }

      const liveLink =
        repo.homepage && repo.homepage.trim() !== ""
          ? repo.homepage
          : `https://${username}.github.io/${repo.name}`;

      const card = document.createElement("div");
      card.className = "project-card";

      card.innerHTML = `

        <div class="card-glow"></div>

        <div class="project-header">

          <div>
            <h2>${repo.name}</h2>

            <p class="updated">
              Updated: ${new Date(repo.updated_at).toLocaleDateString()}
            </p>
          </div>

          <span class="status ${repo.homepage ? 'live' : 'code-only'}">
            ${repo.homepage ? 'LIVE' : 'CODE'}
          </span>

        </div>

        <p class="description">
          ${repo.description || "No description available for this project."}
        </p>

        <div class="topics">

          ${
            topics.length > 0
              ? topics.map(topic => `<span>${topic}</span>`).join("")
              : `<span>github-project</span>`
          }

        </div>

        <div class="project-buttons">

          <a href="${liveLink}" target="_blank" class="run-btn">
            ▶ Run Project
          </a>

          <a href="${repo.html_url}" target="_blank" class="code-btn">
            View Code
          </a>

        </div>

      `;

      container.appendChild(card);

    });

  } catch (error) {

    console.log(error);

    container.innerHTML = `
      <div class="error-box">
        Failed to load GitHub projects.
      </div>
    `;
  }
}

loadProjects();

</script>

</body>
</html>
